<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DogPuzzle 관리자</title>
<style>
  :root {
    --bg:#12161b; --card:#1a2028; --line:#263040;
    --ink:#e6edf5; --dim:#8b9bb0; --accent:#0e8f87; --accent-soft:#17b3a8;
    --warn:#d9a441; --danger:#d95757;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .head .spacer{flex:1}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;
         padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button:disabled{opacity:.5;cursor:default}

  .login{max-width:360px;margin:80px auto;background:var(--card);
         border:1px solid var(--line);border-radius:14px;padding:26px}
  .login h2{margin:0 0 6px;font-size:17px}
  .login p{margin:0 0 18px;color:var(--dim);font-size:12.5px}
  input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
        background:#0e1319;color:var(--ink);font-size:14px;margin-bottom:10px}
  .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:18px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card .label{color:var(--dim);font-size:11.5px;letter-spacing:.3px}
  .card .value{font-size:22px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}

  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  select,input[type=search]{background:#0e1319;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:13px;width:auto;margin:0}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;min-width:720px}
  th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#151b23;color:var(--dim);font-size:11.5px;font-weight:700;letter-spacing:.3px}
  tr:last-child td{border-bottom:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px}
  .pill.today{background:rgba(23,179,168,.16);color:var(--accent-soft)}
  .pill.heart{background:rgba(217,87,87,.16);color:#e88}
  .muted{color:var(--dim)}
  .notice{background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.35);
    color:var(--warn);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px}
  .empty{padding:28px;text-align:center;color:var(--dim)}
  .tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
  .tabs button{background:transparent;color:var(--dim);border:1px solid var(--line)}
  .tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.danger{background:var(--danger)}
  button.sm{padding:5px 10px;font-size:12px}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  input[type=number],input[type=text]{background:#0e1319;color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:14px;padding:22px;max-width:430px;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 12px;font-size:16px}
  dialog label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
  dialog input{width:100%;margin:0}
  .row{display:flex;gap:8px}
  .row > *{flex:1}
  h2{font-size:15px;margin:26px 0 10px}

  /* 차트 — 외부 라이브러리 없이 SVG로 그린다 */
  .chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 8px}
  .chart svg{width:100%;height:170px;display:block}
  .chart .gl{stroke:var(--line);stroke-width:1}
  .chart .ax{fill:var(--dim);font-size:11px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  .lg{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
  .lg i{width:10px;height:10px;border-radius:3px;display:inline-block}

  .bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .bar-row:last-child{margin-bottom:0}
  .bar-label{width:64px;color:var(--dim);font-size:12.5px;text-align:right}
  .bar-track{flex:1;height:14px;background:#0e1319;border-radius:7px;overflow:hidden}
  .bar-fill{display:block;height:100%;background:var(--accent-soft);border-radius:7px}
  .bar-value{width:56px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}

  /* 지급 묶음 명단 */
  .mem{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border-radius:6px;
       background:#0e1319;color:var(--dim);font-size:12px}
  .mem.got{background:rgba(23,179,168,.16);color:var(--accent-soft);font-weight:700}

  input[type=checkbox]{width:auto;margin:0;accent-color:var(--accent)}
  textarea{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);
    background:#0e1319;color:var(--ink);font-size:14px;font-family:inherit;resize:vertical}
  input[type=datetime-local]{background:#0e1319;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:13px;width:100%}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">불러오는 중…</div></div>


<dialog id="grantDlg">
  <h3 id="grantTitle">보상 지급</h3>
  <div class="muted" style="font-size:12.5px" id="grantWho"></div>
  <div class="row">
    <div><label>코인</label><input type="number" id="gCoins" value="0" min="0"></div>
    <div><label>힌트</label><input type="number" id="gHints" value="0" min="0"></div>
    <div><label>자동배치</label><input type="number" id="gAutos" value="0" min="0"></div>
  </div>
  <label>메모 (앱에서 사용자에게 보입니다)</label>
  <input type="text" id="gMemo" placeholder="예: 점검 보상">
  <div class="row">
    <div><label>받기 시작 (비우면 즉시)</label><input type="datetime-local" id="gStart"></div>
    <div><label>받기 마감 (비우면 무제한)</label><input type="datetime-local" id="gEnd"></div>
  </div>
  <div class="err" id="gErr"></div>
  <div class="actions" style="margin-top:16px;justify-content:flex-end">
    <button class="ghost" id="gCancel">취소</button>
    <button id="gOk">지급</button>
  </div>
</dialog>
<dialog id="noticeDlg">
  <h3>공지 작성</h3>
  <div class="muted" style="font-size:12.5px">앱이 접속할 때 가장 최근 공지 하나를 한 번만 보여줍니다.</div>
  <label>제목</label>
  <input type="text" id="nTitle" placeholder="예: 점검 안내">
  <label>내용</label>
  <textarea id="nBody" rows="4" placeholder="앱에서 그대로 보입니다"></textarea>
  <div class="row">
    <div><label>시작 (비우면 즉시)</label><input type="datetime-local" id="nStart"></div>
    <div><label>종료 (비우면 무제한)</label><input type="datetime-local" id="nEnd"></div>
  </div>
  <div class="err" id="nErr"></div>
  <div class="actions" style="margin-top:16px;justify-content:flex-end">
    <button class="ghost" id="nCancel">취소</button>
    <button id="nOk">등록</button>
  </div>
</dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
